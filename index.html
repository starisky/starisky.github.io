<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sketchfab raw-API viewer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <label>uid <input id="uid" size="40" value="784e95f4f22545199be7e165af6437f8"></label>
  <label>api <input id="apiver" size="7" value="1.12.0"></label>
  <button id="load">Load</button>
  <span id="status">idle</span>
</header>

<main>
  <section id="stage"><div id="frame"></div></section>

  <aside>
    <fieldset>
      <legend>Camera</legend>

      <label class="row">mode
        <select id="camMode">
          <option value="keep">(no change)</option>
          <option value="orbit">Orbit / free</option>
          <option value="constrained">Constrained orbit</option>
          <option value="front">Front</option>
          <option value="back">Back</option>
          <option value="left">Left</option>
          <option value="right">Right</option>
          <option value="top">Top</option>
          <option value="iso">Iso</option>
        </select>
      </label>

      <label class="row">position
        <span class="vec">
          <input id="px" type="number" step="0.1"><input id="py" type="number" step="0.1"><input id="pz" type="number" step="0.1">
        </span>
      </label>
      <label class="row">target
        <span class="vec">
          <input id="tx" type="number" step="0.1"><input id="ty" type="number" step="0.1"><input id="tz" type="number" step="0.1">
        </span>
      </label>
      <label class="row">fov <input id="fov" type="number" step="1" placeholder="45"></label>
      <label class="row">roll <input id="roll" type="number" step="1" placeholder="0"></label>
      <label class="row">duration <input id="dur" type="number" step="0.1" value="1"></label>

      <div class="row">
        <button id="camRead">Read</button>
        <button id="camApply">Apply</button>
        <button id="camFit">Fit visible</button>
        <button id="camHome">Recenter</button>
      </div>
      <label class="row">constraints json
        <textarea id="constraints" rows="3">{}</textarea>
      </label>
      <div class="row"><button id="camConstraints">Send constraints</button></div>
    </fieldset>

    <fieldset>
      <legend>Scene <span id="nodeCount" class="muted"></span></legend>
      <div class="row">
        <input id="filter" placeholder="filter name">
        <button id="showAll">Show all</button>
        <button id="hideAll">Hide all meshes</button>
      </div>
      <div id="tree" class="tree"></div>
    </fieldset>

    <fieldset>
      <legend>Raw RPC</legend>
      <div class="row">
        <input id="rpcMember" value="getSceneGraph">
        <button id="rpcSend">Send</button>
      </div>
      <textarea id="rpcArgs" rows="2">[]</textarea>
      <pre id="rpcOut"></pre>
    </fieldset>
  </aside>
</main>

<script type="module" src="app.js"></script>
</body>
</html>
